services:
  db:
    image: mysql:8.0
    container_name: checkai_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-checkai}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - checkai_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-user}", "-p${MYSQL_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fake-news-checker-back
      dockerfile: Dockerfile
    container_name: checkai_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./fake-news-checker-back:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-user}:${MYSQL_PASSWORD:-password}@db:3306/${MYSQL_DATABASE:-checkai}
      API_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./fake-news-checker-front
      dockerfile: Dockerfile
    container_name: checkai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000" # Porta padrão do Vite. Mude se for diferente.
    volumes:
      - ./fake-news-checker-front:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  notebooks:
    build:
      context: ./fake-news-checker-model
      dockerfile: Dockerfile
    container_name: checkai_notebooks
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    working_dir: /app/fake-news-checker-model
    command: jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser --token=''

volumes:
  checkai_db_data:
    driver: local
